<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Outfit';font-weight:700;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Bold.ttf')}
@font-face{font-family:'Outfit';font-weight:400;src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Regular.ttf')}
@font-face{font-family:'GeistMono';src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/GeistMono-Regular.ttf')}
html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#F9F2E7}
svg{display:block}
.t{font-family:'Outfit',sans-serif}
.m{font-family:'GeistMono',monospace}
</style></head>
<body>
<svg id="s" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <path id="mango" d="M100 18C150 18 186 62 184 118C182 176 140 208 96 206C48 204 16 168 18 120C20 84 44 60 64 44C76 34 86 18 100 18Z"/>
    <radialGradient id="gRipe" cx=".7" cy=".3" r=".9"><stop offset="0" stop-color="#E2471B"/><stop offset=".35" stop-color="#F07A12"/><stop offset=".8" stop-color="#F4A300"/><stop offset="1" stop-color="#F2C14E"/></radialGradient>
    <radialGradient id="gFlesh" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#FFD067"/><stop offset="1" stop-color="#F4A300"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F4A300" stop-opacity=".28"/><stop offset="1" stop-color="#F4A300" stop-opacity="0"/></radialGradient>
        <g id="fly"><ellipse cx="-7" cy="-7" rx="8" ry="12" fill="#FFFFFF" opacity=".8"/><ellipse cx="7" cy="-7" rx="8" ry="12" fill="#FFFFFF" opacity=".8"/><ellipse cx="0" cy="3" rx="6" ry="11" fill="#2A1C12"/></g>
  </defs>

  <rect id="bg" width="1080" height="1080" fill="#F9F2E7"/>

  <!-- ===== Segment A: product ===== -->
  <g id="A">
    <circle id="aGlow" cx="540" cy="580" r="420" fill="url(#glow)"/>
    <ellipse id="aShadow" cx="540" cy="890" rx="210" ry="24" fill="#3B2A1E" opacity=".14"/>
    <g id="aHook">
      <text class="t" x="540" y="168" text-anchor="middle" font-size="74" font-weight="700" letter-spacing="-2" fill="#3B2A1E">Pourquoi l'Europe</text>
      <text class="t" x="540" y="252" text-anchor="middle" font-size="74" font-weight="700" letter-spacing="-2" fill="#3B2A1E"><tspan fill="#B23A1F">refuse</tspan> cette mangue ?</text>
    </g>
    <g id="aFruit">
      <use href="#mango" fill="url(#gRipe)"/>
      <ellipse cx="66" cy="76" rx="14" ry="30" transform="rotate(30 66 76)" fill="#FFF6DD" opacity=".35"/>
      <path d="M100 18C102 8 108 2 116 0" stroke="#3B2A1E" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="134" cy="6" rx="30" ry="10" transform="rotate(-18 134 6)" fill="#2F5D3A"/>
      <g id="aSticker" transform="translate(4 -40) rotate(-10 128 128)">
        <ellipse cx="128" cy="128" rx="30" ry="22" fill="#FFFBF3" stroke="#E6D3B0" stroke-width="1.5"/>
        <text class="t" x="128" y="125" text-anchor="middle" font-size="9" font-weight="700" fill="#2F5D3A">CÔTE</text>
        <text class="t" x="128" y="137" text-anchor="middle" font-size="9" font-weight="700" fill="#E8730C">D'IVOIRE</text>
      </g>
    </g>
    <g id="aStamp">
      <rect x="-230" y="-82" width="460" height="164" rx="22" fill="#FBF6EC" fill-opacity=".9" stroke="#B23A1F" stroke-width="9"/>
      <rect x="-212" y="-64" width="424" height="128" rx="14" fill="none" stroke="#B23A1F" stroke-width="3"/>
      <text class="t" x="0" y="-8" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="6" fill="#B23A1F">IMPORT UE</text>
      <text class="t" x="0" y="42" text-anchor="middle" font-size="50" font-weight="700" letter-spacing="6" fill="#B23A1F">SUSPENDU</text>
    </g>
    <text id="aCap" class="m" x="540" y="975" text-anchor="middle" font-size="30" letter-spacing="6" fill="#9C4A05">MANGUE DE CÔTE D'IVOIRE</text>
  </g>

  <!-- ===== Segment B ===== -->
  <g id="B">
    <!-- B1: the sector -->
    <g id="b1">
      <text id="b1k" class="m" x="540" y="250" text-anchor="middle" font-size="32" letter-spacing="6" fill="#9C4A05">LA FILIÈRE MANGUE IVOIRIENNE</text>
      <text id="b1n" class="t" x="540" y="470" text-anchor="middle" font-size="190" font-weight="700" letter-spacing="-8" fill="#3B2A1E">0</text>
      <text id="b1u" class="t" x="540" y="550" text-anchor="middle" font-size="46" fill="#6B5847">tonnes de mangues par an</text>
      <g id="b1p">
        <rect x="120" y="640" width="840" height="150" rx="75" fill="#2F5D3A"/>
        <text class="t" x="540" y="736" text-anchor="middle" font-size="50" font-weight="700" fill="#FBF6EC">≈ 100 000 personnes en vivent</text>
      </g>
      <g id="b1m"></g>
    </g>

    <!-- B2: the crisis -->
    <g id="b2">
      <text id="b2k" class="m" x="540" y="230" text-anchor="middle" font-size="32" letter-spacing="6" fill="#F2C14E">DEPUIS LE 1ER AOÛT 2026</text>
      <text id="b2a" class="t" x="540" y="330" text-anchor="middle" font-size="76" font-weight="700" letter-spacing="-2" fill="#FBF6EC">L'Europe refuse</text>
      <text id="b2b" class="t" x="540" y="414" text-anchor="middle" font-size="76" font-weight="700" letter-spacing="-2" fill="#FBF6EC">la mangue fraîche ivoirienne.</text>
      <g id="b2fruit" transform="translate(440 470)">
        <use href="#mango" fill="url(#gRipe)"/>
        <use href="#mango" fill="#B23A1F" opacity=".25"/>
        <circle cx="70" cy="110" r="9" fill="#7A3B1A" opacity=".5"/><circle cx="122" cy="150" r="12" fill="#7A3B1A" opacity=".45"/><circle cx="140" cy="88" r="6" fill="#7A3B1A" opacity=".5"/>
      </g>
      <g id="flies"><use id="f1" href="#fly"/><use id="f2" href="#fly"/><use id="f3" href="#fly"/></g>
      <g id="b2c">
        <text class="t" x="540" y="800" text-anchor="middle" font-size="44" fill="#F2C14E">Cause : la mouche des fruits</text>
        <text class="t" x="540" y="884" text-anchor="middle" font-size="64" font-weight="700" fill="#FBF6EC">27 lots interceptés en 2026</text>
      </g>
    </g>

    <!-- B3: transform -->
    <g id="b3">
      <text id="b3a" class="t" x="540" y="240" text-anchor="middle" font-size="80" font-weight="700" letter-spacing="-2" fill="#3B2A1E">Et si on transformait ici ?</text>
      <g id="icons"></g>
      <text id="b3b" class="t" x="540" y="930" text-anchor="middle" font-size="44" fill="#6B5847">Chaque mangue transformée ici garde sa valeur ici.</text>
    </g>

    <!-- B4: end card -->
    <g id="b4">
      <g id="b4fruit" transform="translate(440 150)">
        <use href="#mango" fill="url(#gRipe)"/>
        <ellipse cx="66" cy="76" rx="14" ry="30" transform="rotate(30 66 76)" fill="#FFF6DD" opacity=".35"/>
        <path d="M100 18C102 8 108 2 116 0" stroke="#3B2A1E" stroke-width="5" fill="none" stroke-linecap="round"/>
        <ellipse cx="134" cy="6" rx="30" ry="10" transform="rotate(-18 134 6)" fill="#2F5D3A"/>
      </g>
      <text id="b4a" class="t" x="540" y="520" text-anchor="middle" font-size="96" font-weight="700" letter-spacing="-3" fill="#3B2A1E">Mangue de Côte d'Ivoire</text>
      <text id="b4b" class="t" x="540" y="600" text-anchor="middle" font-size="44" fill="#6B5847">Histoire, crise et solutions de la filière</text>
      <g id="b4c">
        <rect x="250" y="660" width="580" height="104" rx="52" fill="#3B2A1E"/>
        <circle id="live" cx="312" cy="712" r="11" fill="#F4A300"/>
        <text class="t" x="342" y="727" font-size="42" font-weight="700" fill="#FBF6EC">Le site arrive bientôt</text>
        <g fill="#F4A300"><circle id="d1" cx="760" cy="722" r="5"/><circle id="d2" cx="776" cy="722" r="5"/><circle id="d3" cx="792" cy="722" r="5"/></g>
      </g>
      <g id="b4d">
        <circle cx="430" cy="880" r="44" fill="#FFFFFF"/>
        <image href="file:///home/claude/maison_doudjo_brand/02-Cabosse-secondary/png/cabosse-mark-color.png" x="400" y="850" width="60" height="60"/>
        <text class="m" x="492" y="892" font-size="34" fill="#3B2A1E">@BlackSun225</text>
      </g>
    </g>
  </g>
</svg>
<script>
const $ = id => document.getElementById(id);
const cl = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const k = (t,a,b)=>cl((t-a)/(b-a));
const out = x=>1-Math.pow(1-x,3);
const inout = x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back = x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const lerp=(a,b,x)=>a+(b-a)*x;
function op(id,v){ $(id).setAttribute('opacity', v.toFixed(3)); }
function tr(id,s){ $(id).setAttribute('transform', s); }
const fmt = n => Math.round(n).toLocaleString('fr-FR').replace(/ | /g,' ');

/* small floating mangoes for B1 */
const bm = $('b1m');
const mPos=[[110,170,.42,-20],[930,200,.36,25],[150,900,.38,15],[900,880,.44,-30]];
mPos.forEach((p,i)=>{ const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.id='bm'+i;
  g.innerHTML='<use href="#mango" fill="url(#gRipe)"/><ellipse cx="134" cy="6" rx="30" ry="10" transform="rotate(-18 134 6)" fill="#2F5D3A"/>'; bm.appendChild(g); });

/* product icons for B3 */
const ICONS = [
 ['Séchée','<rect x="-70" y="-14" width="140" height="10" rx="4" fill="#C9AE7A"/><g fill="#E8730C"><rect x="-64" y="-40" width="34" height="22" rx="11"/><rect x="-24" y="-40" width="34" height="22" rx="11"/><rect x="16" y="-40" width="34" height="22" rx="11"/></g><g fill="#F4A300"><rect x="-64" y="6" width="34" height="22" rx="11"/><rect x="-24" y="6" width="34" height="22" rx="11"/><rect x="16" y="6" width="34" height="22" rx="11"/></g>'],
 ['Jus','<path d="M-14 -64h28v16c0 10 18 14 18 34v70a10 10 0 0 1-10 10h-44a10 10 0 0 1-10-10v-70c0-20 18-24 18-34z" fill="#FFF6DD" stroke="#3B2A1E" stroke-width="3"/><path d="M-24 -4h48v60a8 8 0 0 1-8 8h-32a8 8 0 0 1-8-8z" fill="#F4A300"/><rect x="-16" y="-74" width="32" height="12" rx="3" fill="#2F5D3A"/>'],
 ['Purée','<path d="M-70 -6h140a70 56 0 0 1-140 0z" fill="#C9864A"/><ellipse cx="0" cy="-6" rx="70" ry="14" fill="#F4A300"/>'],
 ['Confiture','<rect x="-42" y="-40" width="84" height="100" rx="14" fill="#E8730C"/><rect x="-46" y="-58" width="92" height="22" rx="6" fill="#2F5D3A"/><rect x="-28" y="-4" width="56" height="34" rx="5" fill="#FFF6DD"/>'],
 ['Glace','<path d="M-26 6l26 70 26-70z" fill="#D8A866"/><circle cx="0" cy="-8" r="30" fill="#F4A300"/><circle cx="0" cy="-42" r="24" fill="#F2C14E"/>'],
 ['Beurre de noyau','<rect x="-48" y="-30" width="96" height="84" rx="12" fill="#FFF6DD" stroke="#3B2A1E" stroke-width="3"/><ellipse cx="0" cy="-30" rx="48" ry="12" fill="#F6E7B8" stroke="#3B2A1E" stroke-width="3"/><rect x="-32" y="0" width="64" height="24" rx="4" fill="#2F5D3A"/>']
];
const ic=$('icons');
ICONS.forEach((d,i)=>{ const col=i%3,row=Math.floor(i/3); const x=240+col*300, y=430+row*260;
  const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.id='ic'+i; g.dataset.x=x; g.dataset.y=y;
  g.innerHTML='<circle r="96" fill="#FFFFFF" opacity=".9"/><g>'+d[1]+'</g><text class="t" y="140" text-anchor="middle" font-size="36" font-weight="700" fill="#3B2A1E">'+d[0]+'</text>';
  ic.appendChild(g); });

const CREAM='#F9F2E7', EARTH='#3B2A1E';
function mix(c1,c2,x){const a=parseInt(c1.slice(1),16),b=parseInt(c2.slice(1),16);
  const r=Math.round(lerp(a>>16,b>>16,x)),g=Math.round(lerp((a>>8)&255,(b>>8)&255,x)),bl=Math.round(lerp(a&255,b&255,x));
  return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);}

window.renderA = function(t){ /* 0..3s */
  $('A').style.display=''; $('B').style.display='none'; $('bg').setAttribute('fill',CREAM);
  const T=window.__T??t; const bob=Math.sin(T*2.2)*6;
  /* stamp hit at 1.7s with a short shake */
  const hit=k(t,1.7,1.88), shake=t>1.88&&t<2.08?Math.sin(t*120)*6*(1-k(t,1.88,2.08)):0;
  const s=lerp(2.55,2.62,out(k(t,0,2.4)));
  const exit=inout(k(t,2.45,3.0));
  tr('aFruit',`translate(${540+shake} ${590+bob}) rotate(${lerp(-3,0,out(k(t,0,1.4)))}) scale(${s*lerp(1,.86,exit)}) translate(-100 -112)`);
  op('aHook',out(k(t,.7,1.2))); tr('aHook',`translate(0 ${lerp(24,0,out(k(t,.7,1.2)))})`);
  op('aStamp',k(t,1.7,1.76)*.92);
  tr('aStamp',`translate(${530+shake} 730) rotate(-10) scale(${lerp(1.9,1,out(hit))})`);
  op('A',1-k(t,2.6,3.0));
};

window.renderB = function(t){ /* 0..15s design time */
  const T=window.__T??t;
  $('A').style.display='none'; $('B').style.display='';
  /* background: cream -> earth (crisis) -> cream */
  const dark=k(t,3.4,3.9)*(1-k(t,7.4,7.9));
  $('bg').setAttribute('fill',mix(CREAM,EARTH,dark));

  /* B1 0..3.8 */
  const b1in=k(t,0,.4), b1out=k(t,3.4,3.8);
  op('b1',b1in*(1-b1out));
  op('b1k',out(k(t,.1,.6)));
  $('b1n').textContent=fmt(180000*out(k(t,.3,1.8)));
  tr('b1n',`translate(0 ${lerp(30,0,out(k(t,.2,.8)))})`); op('b1n',out(k(t,.2,.7)));
  op('b1u',out(k(t,.9,1.4)));
  const pp=back(k(t,1.9,2.5)); tr('b1p',`translate(540 715) scale(${cl(pp,0,1.2)}) translate(-540 -715)`); op('b1p',k(t,1.9,2.1));
  mPos.forEach((p,i)=>{ const a=out(k(t,.2+i*.12,1+i*.12)); tr('bm'+i,`translate(${p[0]} ${p[1]+Math.sin(T*1.8+i)*10+lerp(40,0,a)}) rotate(${p[3]+Math.sin(T+i)*4}) scale(${p[2]}) translate(-100 -112)`); op('bm'+i,a); });

  /* B2 3.8..7.8 */
  const b2in=k(t,3.7,4.1), b2out=k(t,7.5,7.9);
  op('b2',b2in*(1-b2out));
  op('b2k',out(k(t,3.9,4.3)));
  op('b2a',out(k(t,4.0,4.5))); tr('b2a',`translate(0 ${lerp(24,0,out(k(t,4.0,4.5)))})`);
  op('b2b',out(k(t,4.2,4.7))); tr('b2b',`translate(0 ${lerp(24,0,out(k(t,4.2,4.7)))})`);
  const fr=out(k(t,4.4,5.0)); tr('b2fruit',`translate(540 586) scale(${lerp(.4,1.2,fr)}) translate(-100 -112)`); op('b2fruit',fr);
  [['f1',0,1],['f2',2.1,1.3],['f3',4.2,.8]].forEach(([id,ph,sp],i)=>{ const a=k(t,4.8+i*.2,5.2+i*.2);
    const ang=T*2.4*sp+ph, r=175+Math.sin(T*3+ph)*24;
    tr(id,`translate(${540+Math.cos(ang)*r} ${586+Math.sin(ang)*r*.7}) rotate(${Math.sin(T*6+ph)*25}) scale(${1.5+.1*Math.sin(T*40+ph)})`); op(id,a); });
  op('b2c',out(k(t,5.6,6.1))); tr('b2c',`translate(0 ${lerp(24,0,out(k(t,5.6,6.1)))})`);

  /* B3 7.8..11.8 */
  const b3in=k(t,7.8,8.2), b3out=k(t,11.4,11.8);
  op('b3',b3in*(1-b3out));
  op('b3a',out(k(t,7.9,8.4))); tr('b3a',`translate(0 ${lerp(24,0,out(k(t,7.9,8.4)))})`);
  ICONS.forEach((d,i)=>{ const g=$('ic'+i); const a=k(t,8.4+i*.18,8.9+i*.18); const s=cl(back(a),0,1.2);
    g.setAttribute('transform',`translate(${g.dataset.x} ${+g.dataset.y+Math.sin(T*2+i)*5}) scale(${s})`); g.setAttribute('opacity',a.toFixed(3)); });
  op('b3b',out(k(t,9.9,10.4)));

  /* B4 11.8..15 */
  const b4in=k(t,11.8,12.2);
  op('b4',b4in);
  const f4=out(k(t,11.9,12.6)); tr('b4fruit',`translate(540 ${300+Math.sin(T*2)*6}) rotate(${lerp(-12,0,f4)}) scale(${lerp(.4,1.1,f4)}) translate(-100 -112)`); op('b4fruit',f4);
  op('b4a',out(k(t,12.2,12.7))); tr('b4a',`translate(0 ${lerp(24,0,out(k(t,12.2,12.7)))})`);
  op('b4b',out(k(t,12.4,12.9)));
  const c=back(k(t,12.7,13.2)); tr('b4c',`translate(540 712) scale(${cl(c,0,1.2)}) translate(-540 -712)`); op('b4c',k(t,12.7,12.9));
  op('b4d',out(k(t,13.1,13.6)));
  /* waiting dots and a pulsing light on the teaser pill */
  ['d1','d2','d3'].forEach((id,i)=>op(id,.25+.75*Math.max(0,Math.sin(T*4-i*.9))));
  op('live',.55+.45*Math.sin(T*5));
};

/* Reading pauses: design time freezes at each hold while ambient motion continues */
function remap(T,holds){ let shift=0; for(const [at,dur] of holds){ const l=T-shift; if(l<=at) return l; if(l<at+dur) return at; shift+=dur; } return T-shift; }
const HOLDS_A=[[2.2,1.2]];
const HOLDS_B=[[2.6,1.6],[5.0,0.8],[6.2,2.0],[10.5,2.0],[14.0,1.5]];
window.renderAR=function(T){ window.__T=T; renderA(remap(T,HOLDS_A)); };
window.renderBR=function(T){ window.__T=T; renderB(remap(T,HOLDS_B)); };
</script>
</body></html>
